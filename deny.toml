[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "AGPL-3.0-or-later",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "OpenSSL",
  "CC0-1.0",
]

[advisories]
ignore = [
  # rustls-pemfile unmaintained — transitive dep from async-nats, no upgrade path yet
  "RUSTSEC-2025-0134",
  # rsa timing sidechannel — transitive dep from sqlx-mysql, no safe upgrade available
  "RUSTSEC-2023-0071",
  # proc-macro-error unmaintained — transitive dep from rust-embed, no upgrade path yet
  "RUSTSEC-2024-0370",
  # AWS-LC advisories — transitive deps from rustls/tokio-rustls, awaiting upstream patch
  "RUSTSEC-2026-0044",
  "RUSTSEC-2026-0045",
  "RUSTSEC-2026-0046",
  "RUSTSEC-2026-0047",
  "RUSTSEC-2026-0048",
  "RUSTSEC-2026-0049",
  # rand unsoundness with custom logger — not applicable (no custom logger)
  "RUSTSEC-2026-0097",
  # rustls-webpki URI/wildcard name constraint issues — transitive deps from reqwest 0.11,
  # async-nats 0.35, and rustls 0.23; pinned by upstream, low exploitability (requires
  # misissuance after signature verification). Run `cargo update -p rustls-webpki` to fix
  # the 0.103.x version; 0.101.x and 0.102.x await upstream upgrades.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  # rustls-webpki reachable panic in CRL parsing — transitive via the rustls
  # stack used by the workspace-api email/IMAP TLS path; low exploitability,
  # awaiting upstream bump.
  "RUSTSEC-2026-0104",
  # core2 unmaintained / yanked — transitive dep (mailparse/quoted_printable
  # tree); no functional impact, no upgrade path yet.
  "RUSTSEC-2026-0105",
  # lopdf unbounded recursion / stack overflow on crafted PDFs — transitive
  # via pdf-extract 0.7 → lopdf 0.34. Fixed in lopdf 0.42 / pdf-extract 0.12;
  # that bump needs a newer rustc (let-chains) and is a separate upgrade.
  "RUSTSEC-2026-0187",
  # h2 empty DATA frame DoS — patched in 0.4.16. The 0.3.x line is pinned by
  # reqwest 0.11 / hyper 0.14; 0.4 is upgraded in Cargo.lock.
  "RUSTSEC-2026-0258",
]

[bans]
deny = [
  { name = "openssl-sys" },
  { name = "native-tls" },
]
