name: Build

# Compile check is a separate workflow from CI (lint, test, secret scan)
# so those jobs can finish without waiting on a release cargo build, and
# branch protection can require them independently.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HUGO_VERSION: "0.155.3"

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar xz -C /usr/local/bin hugo
      - name: Build static assets
        run: hugo --minify --source status-site
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
