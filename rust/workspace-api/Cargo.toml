[package]
name = "workspace-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
broodlink-config = { path = "../../crates/broodlink-config" }
broodlink-secrets = { path = "../../crates/broodlink-secrets" }
broodlink-telemetry = { path = "../../crates/broodlink-telemetry" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs"] }
reqwest = { workspace = true, features = ["stream"] }
futures = "0.3"
tokio-stream = "0.1"
sqlx = { workspace = true, features = ["macros"] }
chrono = { workspace = true }
uuid = { workspace = true }
rand = "0.8"
cron = "0.12"
bcrypt = "0.15"
imap = { version = "2", default-features = false }
imap-proto = "0.10"
rustls = { workspace = true }
webpki-roots = "0.26"
ring = "0.17"
base64 = "0.13"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
sysinfo = "0.30"
mailparse = "0.15"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
